[package]
name = "chronoxide"
version = "0.1.0"
authors = ["Riccardo De Benedictis"]
edition = "2024"
description = "Chronoxide is a high-performance, timeline-based planner built in Rust"
readme = "README.md"
repository = "https://github.com/ratioSolver/Chronoxide"
license-file = "LICENSE.txt"

[features]
default = ["server", "h2"]
server = ["dep:axum", "dep:tower-http", "dep:tracing-subscriber"]
h_max = []
h_add = []
h2 = []

[lib]
name = "chronoxide"

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[dependencies]
rug = "1.30.0"
semitone = "0.0.39"
riddle-lang = "0.2.31"
axum = { version = "0.8.9", features = ["ws"], optional = true }
tower-http = { version = "0.7.1", features = ["fs"], optional = true }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
], optional = true }
serde_json = "1.0.154"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
