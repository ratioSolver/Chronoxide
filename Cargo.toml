[package]
name = "chronoxide"
version = "0.1.0"
authors = ["Riccardo De Benedictis"]
edition = "2024"
description = "Chronoxide is a high-performance, timeline-based planner built in Rust"
readme = "README.md"
repository = "https://github.com/ratioSolver/Chronoxide"
license-file = "LICENSE.txt"

[features]
default = ["server"]
server = ["dep:axum", "dep:tower-http"]

[lib]
name = "chronoxide"

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[dependencies]
riddle-lang = "0.2.0"
z3 = "0.20.2"
axum = { version = "0.8.9", features = ["ws"], optional = true }
tower-http = { version = "0.7.0", features = ["fs"], optional = true }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
serde_json = "1.0.150"
